<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080d" />
    <link rel="icon" type="image/svg+xml" href="/public/loupe-logo.svg" />
    <title>Entrar — SearchForLeads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-screen">
      <section class="auth-layout" aria-label="Acesso ao SearchForLeads">
        <aside class="auth-intro">
          <a class="auth-brand" href="/#top" aria-label="SearchForLeads, voltar para a página inicial">
            <img src="/public/loupe-logo.svg" alt="" />
            <span>SearchForLeads</span>
          </a>
          <div class="auth-intro-bottom">
            <h1>Encontre leads com mais contexto.</h1>
            <div class="auth-social-proof">
              <div class="auth-avatars" aria-hidden="true">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=96&amp;h=96&amp;q=80" alt="" />
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=96&amp;h=96&amp;q=80" alt="" />
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&amp;fit=crop&amp;w=96&amp;h=96&amp;q=80" alt="" />
              </div>
              <p><strong>200+</strong> pessoas já entraram para encontrar novos leads</p>
            </div>
          </div>
        </aside>

        <section class="auth-card" aria-labelledby="auth-title">
          <h2 id="auth-title">Volte para o radar.</h2>
          <p class="auth-copy" id="auth-copy">Entre para continuar sua busca de leads.</p>

          <form class="auth-form" id="auth-form">
            <div class="auth-field" data-signup-only hidden>
              <label for="auth-name">Nome</label>
              <input id="auth-name" type="text" autocomplete="name" placeholder="Como podemos te chamar?" />
            </div>
            <div class="auth-field">
              <label for="auth-email">Email</label>
              <input id="auth-email" type="email" autocomplete="email" placeholder="voce@empresa.com" required />
            </div>
            <div class="auth-field">
              <div class="auth-password-label-row">
                <label for="auth-password">Senha</label>
                <button class="auth-text-action" id="auth-forgot-password" type="button" data-login-only>Esqueci?</button>
              </div>
              <div class="auth-password-wrap">
                <input id="auth-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" minlength="6" required />
                <button class="auth-password-toggle" id="auth-password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-3.1 3.7M6.2 6.2C3.9 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.2-.2 3.1-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <div class="auth-field" data-signup-only hidden>
              <label for="auth-confirm">Confirmar senha</label>
              <input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Repita sua senha" minlength="6" />
            </div>
            <p class="auth-message" id="auth-message" role="alert" aria-live="polite"></p>
            <button class="qualify-button auth-page-submit" type="submit" id="auth-submit"><span>Entrar</span><span aria-hidden="true">↗</span></button>
          </form>
          <div class="auth-divider"><span>ou entre com</span></div>
          <button class="auth-google-button" id="auth-google" type="button">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3a12 12 0 1 1-3.4-13l5.7-5.7A20 20 0 1 0 44 24c0-1.3-.1-2.6-.4-3.9Z"/><path fill="#FF3D00" d="M6.3 14.7 13 19.5C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7A20 20 0 0 0 6.3 14.7Z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44Z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C42 35 44 30 44 24c0-1.3-.1-2.6-.4-3.9Z"/></svg>
            Continuar com Google
          </button>
          <p class="auth-footnote" id="auth-footnote"><span id="auth-mode-caption">Ainda não tem conta?</span> <button type="button" id="auth-mode-toggle">Comece grátis</button></p>
        </section>
      </section>
    </main>

    <script type="module" src="auth.js"></script>
  </body>
</html>
